name: ShiftFlow Heartbeat

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake ShiftFlow heartbeat
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 30 \
            https://shiftflow-kasb.floot.app/_api/heartbeat)
          echo "$response"
